<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --bg: #0f0f10;
    --surface: #19191c;
    --surface-2: #232328;
    --border: #2e2e35;
    --border-2: #3a3a42;
    --text: #f5f5f7;
    --text-dim: #9a9aa3;
    --accent: #3BD2C1;
    --accent-soft: rgba(59, 210, 193, 0.10);
    --success: #4ade80;
    --error: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', Pretendard, system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    overscroll-behavior: none;
  }

  body {
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .title-icon {
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    font-weight: 800;
    font-size: 16px;
  }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    width: 40px;
    height: 40px;
    border-radius: 10px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-family: inherit;
  }
  .icon-btn:active { background: var(--surface-2); }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 11px;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 14px;
    font-weight: 500;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
  .status-pill.connected .status-dot { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-pill.connected { color: var(--success); border-color: rgba(74,222,128,0.3); }

  .tabs {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 14px;
    gap: 4px;
  }
  .tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 11px 8px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .tab.active { background: var(--accent); color: #000; }

  .panel { display: none; }
  .panel.active { display: block; }

  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-label .hint {
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--text-dim);
    font-size: 11px;
    opacity: 0.7;
  }

  .field {
    display: block;
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 14px;
    font-size: 16px;
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .field:focus { outline: none; border-color: var(--accent); background: #060606; }
  .field::placeholder { color: #46464d; }
  textarea.field { resize: none; min-height: 60px; }

  .full-input {
    font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-align: center;
  }

  .stepper-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
  }
  .stepper-col {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .step-btn {
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 0;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.1s;
    user-select: none;
  }
  .step-btn:active { background: var(--accent); color: #000; }
  .seg-input {
    background: var(--bg);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 14px 4px;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
    letter-spacing: 0.04em;
    width: 100%;
    transition: border-color 0.15s, background 0.15s;
  }
  .seg-input:focus { outline: none; border-color: var(--accent); background: #060606; }

  .seg-preview {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
  }
  .seg-preview .seg-input {
    font-size: 18px;
    padding: 12px 4px;
  }
  .loc-dash {
    color: var(--text-dim);
    font-size: 18px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }

  .preview-card {
    background: var(--accent-soft);
    border: 1px solid rgba(245, 184, 0, 0.25);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .preview-card.error {
    background: rgba(248, 113, 113, 0.08);
    border-color: rgba(248, 113, 113, 0.3);
  }
  .preview-card.empty {
    background: var(--surface);
    border: 1px dashed var(--border-2);
  }
  .preview-count {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .preview-card.error .preview-count { color: var(--error); }
  .preview-card.empty .preview-count { color: var(--text-dim); font-weight: 500; }
  .preview-list {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
    line-height: 1.6;
  }
  .preview-card.empty .preview-list { color: var(--text-dim); font-size: 12px; font-family: inherit; }

  .submit-btn {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 14px;
    padding: 19px;
    font-size: 17px;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: -0.01em;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.15s, transform 0.05s;
  }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .recent-section { margin-top: 22px; }
  .recent-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .recent-item:last-child { border-bottom: none; padding-bottom: 0; }
  .recent-item:first-child { padding-top: 0; }
  .recent-loc {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .recent-time { color: var(--text-dim); font-size: 12px; flex-shrink: 0; }
  .recent-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 8px 0;
  }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    z-index: 100;
    max-width: 90%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--error); color: var(--error); }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    backdrop-filter: blur(4px);
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 24px 18px calc(28px + env(safe-area-inset-bottom));
    animation: slideUp 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 18px; letter-spacing: -0.01em; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .modal-field .field { font-size: 14px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions button {
    flex: 1;
    padding: 14px;
    border-radius: 11px;
    font-size: 15px;
    font-weight: 700;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }
  .modal-actions button.primary { background: var(--accent); color: #000; border: none; }
</style>
</head>
<body>

<header>
  <div class="title">
    <div class="title-icon">!</div>
    <span>라벨 훼손 보고</span>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="설정">⚙</button>
</header>

<div id="statusPill" class="status-pill">
  <span class="status-dot"></span>
  <span id="statusText">설정 필요</span>
</div>

<div class="tabs">
  <button class="tab active" data-mode="single">단일</button>
  <button class="tab" data-mode="range">범위</button>
</div>

<!-- 단일 모드 -->
<div class="panel active" id="panel-single">
  <section>
    <div class="section-label">스캔 또는 입력 <span class="hint">PDA 스캐너 OK</span></div>
    <input class="field full-input" id="single-full" placeholder="C01-01-101" autocomplete="off" autocapitalize="characters">
    <div class="stepper-row">
      <div class="stepper-col">
        <button class="step-btn" data-target="single-seg1" data-dir="1">▲</button>
        <input class="seg-input" id="single-seg1" maxlength="4" autocomplete="off" autocapitalize="characters">
        <button class="step-btn" data-target="single-seg1" data-dir="-1">▼</button>
      </div>
      <div class="stepper-col">
        <button class="step-btn" data-target="single-seg2" data-dir="1">▲</button>
        <input class="seg-input" id="single-seg2" maxlength="3" autocomplete="off" inputmode="numeric">
        <button class="step-btn" data-target="single-seg2" data-dir="-1">▼</button>
      </div>
      <div class="stepper-col">
        <button class="step-btn" data-target="single-seg3" data-dir="1">▲</button>
        <input class="seg-input" id="single-seg3" maxlength="3" autocomplete="off" inputmode="numeric">
        <button class="step-btn" data-target="single-seg3" data-dir="-1">▼</button>
      </div>
    </div>
  </section>

  <section>
    <div class="section-label">비고 (선택)</div>
    <textarea class="field" id="single-notes" placeholder="예: 완전 탈락, 인쇄 흐림"></textarea>
  </section>

  <button class="submit-btn" id="single-submit">전송</button>
</div>

<!-- 범위 모드 -->
<div class="panel" id="panel-range">
  <section>
    <div class="section-label">시작 로케이션 <span class="hint">스캔 또는 입력</span></div>
    <input class="field full-input" id="range-start" placeholder="C01-01-101" autocomplete="off" autocapitalize="characters">
    <div class="seg-preview">
      <input class="seg-input" id="start-seg1" maxlength="4" autocomplete="off" autocapitalize="characters">
      <span class="loc-dash">−</span>
      <input class="seg-input" id="start-seg2" maxlength="3" autocomplete="off" inputmode="numeric">
      <span class="loc-dash">−</span>
      <input class="seg-input" id="start-seg3" maxlength="3" autocomplete="off" inputmode="numeric">
    </div>
  </section>

  <section>
    <div class="section-label">끝 로케이션 <span class="hint">스캔 또는 입력</span></div>
    <input class="field full-input" id="range-end" placeholder="C01-01-108" autocomplete="off" autocapitalize="characters">
    <div class="seg-preview">
      <input class="seg-input" id="end-seg1" maxlength="4" autocomplete="off" autocapitalize="characters">
      <span class="loc-dash">−</span>
      <input class="seg-input" id="end-seg2" maxlength="3" autocomplete="off" inputmode="numeric">
      <span class="loc-dash">−</span>
      <input class="seg-input" id="end-seg3" maxlength="3" autocomplete="off" inputmode="numeric">
    </div>
  </section>

  <div class="preview-card empty" id="range-preview">
    <div class="preview-count">미리보기</div>
    <div class="preview-list">시작/끝을 입력하면 범위가 표시돼요</div>
  </div>

  <section>
    <div class="section-label">제외 범위 (선택) <span class="hint">빼고 싶은 구간</span></div>
    <input class="field full-input" id="ex-start" placeholder="시작 예: C01-03-301" autocomplete="off" autocapitalize="characters" style="font-size:15px; margin-bottom:6px;">
    <input class="field full-input" id="ex-end" placeholder="끝 예: C01-03-308" autocomplete="off" autocapitalize="characters" style="font-size:15px;">
  </section>

  <section>
    <div class="section-label">비고 (선택)</div>
    <textarea class="field" id="range-notes" placeholder="예: 한 줄 통째로 훼손"></textarea>
  </section>

  <button class="submit-btn" id="range-submit" disabled>전송</button>
</div>

<div class="recent-section">
  <section>
    <div class="section-label">최근 전송</div>
    <div id="recentList"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>설정</h3>
    <div class="modal-field">
      <label>Apps Script Web App URL</label>
      <input class="field" id="endpointInput" placeholder="https://script.google.com/...">
    </div>
    <div class="modal-actions">
      <button id="modalCancel">취소</button>
      <button class="primary" id="modalSave">저장</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const STORAGE_KEY = 'labelReporter_v3';
const RECENT_KEY = 'labelRecent_v3';

let config = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let recent = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');

function parseLocation(str) {
  if (!str) return null;
  const parts = str.trim().toUpperCase().split(/[-\s]+/).filter(Boolean);
  if (parts.length !== 3) return null;
  return parts;
}

function splitNumeric(seg) {
  const m = String(seg).match(/^([A-Z]*)(\d+)$/i);
  if (!m) return null;
  return { prefix: m[1].toUpperCase(), num: parseInt(m[2], 10), pad: m[2].length };
}

function stepSegment(seg, dir) {
  const s = splitNumeric(seg);
  if (!s) return seg;
  const newNum = Math.max(0, s.num + dir);
  return s.prefix + String(newNum).padStart(s.pad, '0');
}

function timeNow() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function findDiffIndices(a, b) {
  const diffs = [];
  for (let i = 0; i < 3; i++) {
    if (a[i] !== b[i]) diffs.push(i);
  }
  return diffs;
}

function expandRange(start, end, exStart, exEnd) {
  const diffs = findDiffIndices(start, end);
  if (diffs.length === 0) return { ok: false, reason: '시작과 끝이 같아요' };
  if (diffs.length > 2) return { ok: false, reason: '최대 2자리까지 범위 지정 가능해요' };

  // 각 diff 세그먼트의 범위 파싱
  const ranges = [];
  for (const idx of diffs) {
    const s = splitNumeric(start[idx]);
    const e = splitNumeric(end[idx]);
    if (!s || !e) return { ok: false, reason: '숫자 변경만 지원돼요' };
    if (s.prefix !== e.prefix) return { ok: false, reason: '문자 부분이 같아야 해요' };
    ranges.push({ idx, lo: Math.min(s.num, e.num), hi: Math.max(s.num, e.num), prefix: s.prefix, pad: s.pad });
  }

  // 총 개수 체크
  let total = 1;
  for (const r of ranges) total *= (r.hi - r.lo + 1);
  if (total > 500) return { ok: false, reason: '한 번에 500개까지만 (' + total + '개)' };

  // 전체 목록 생성
  const list = [];
  if (ranges.length === 1) {
    const r = ranges[0];
    for (let n = r.lo; n <= r.hi; n++) {
      const parts = [...start];
      parts[r.idx] = r.prefix + String(n).padStart(r.pad, '0');
      list.push(parts.join('-'));
    }
  } else {
    // 2개 세그먼트 조합
    const r0 = ranges[0], r1 = ranges[1];
    for (let n0 = r0.lo; n0 <= r0.hi; n0++) {
      for (let n1 = r1.lo; n1 <= r1.hi; n1++) {
        const parts = [...start];
        parts[r0.idx] = r0.prefix + String(n0).padStart(r0.pad, '0');
        parts[r1.idx] = r1.prefix + String(n1).padStart(r1.pad, '0');
        list.push(parts.join('-'));
      }
    }
  }

  // 제외 처리
  if (exStart && exEnd && exStart.every(s => s) && exEnd.every(s => s)) {
    const exResult = expandRange(exStart, exEnd, null, null);
    if (exResult.ok) {
      const exSet = new Set(exResult.locations);
      const filtered = list.filter(loc => !exSet.has(loc));
      return { ok: true, locations: filtered, excluded: list.length - filtered.length };
    }
  }

  return { ok: true, locations: list, excluded: 0 };
  return { ok: true, locations: list };
}

// ---- 단일 모드 ----
function setupSingle() {
  const full = $('single-full');
  const segs = ['single-seg1', 'single-seg2', 'single-seg3'].map(id => $(id));

  full.addEventListener('input', () => {
    const parts = parseLocation(full.value);
    if (parts) {
      segs[0].value = parts[0];
      segs[1].value = parts[1];
      segs[2].value = parts[2];
    }
  });

  segs.forEach((seg, i) => {
    seg.addEventListener('input', () => {
      if (i === 0) seg.value = seg.value.toUpperCase();
      else seg.value = seg.value.replace(/[^0-9]/g, '');
      const all = segs.map(s => s.value).filter(Boolean);
      if (all.length === 3) full.value = all.join('-');
    });
  });

  document.querySelectorAll('#panel-single .step-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = $(btn.dataset.target);
      const dir = parseInt(btn.dataset.dir);
      if (!target.value) return;
      target.value = stepSegment(target.value, dir);
      const all = segs.map(s => s.value).filter(Boolean);
      if (all.length === 3) full.value = all.join('-');
    });
  });

  $('single-submit').addEventListener('click', async () => {
    const all = segs.map(s => s.value.trim()).filter(Boolean);
    if (all.length !== 3) return showToast('로케이션을 입력해주세요', 'error');
    const location = all.join('-');
    const ok = await sendReport([location], $('single-notes').value.trim(), $('single-submit'), '전송');
    if (ok) {
      full.value = '';
      segs.forEach(s => s.value = '');
      $('single-notes').value = '';
    }
  });
}

// ---- 범위 모드 ----
function setupRange() {
  const startFull = $('range-start');
  const endFull = $('range-end');
  const startSegs = ['start-seg1', 'start-seg2', 'start-seg3'].map(id => $(id));
  const endSegs = ['end-seg1', 'end-seg2', 'end-seg3'].map(id => $(id));

  function syncFromFull(fullEl, segArr) {
    const parts = parseLocation(fullEl.value);
    if (parts) {
      segArr[0].value = parts[0];
      segArr[1].value = parts[1];
      segArr[2].value = parts[2];
    }
    updatePreview();
  }

  startFull.addEventListener('input', () => syncFromFull(startFull, startSegs));
  endFull.addEventListener('input', () => syncFromFull(endFull, endSegs));

  [...startSegs, ...endSegs].forEach((seg, i) => {
    const idx = i % 3;
    const isStart = i < 3;
    seg.addEventListener('input', () => {
      if (idx === 0) seg.value = seg.value.toUpperCase();
      else seg.value = seg.value.replace(/[^0-9]/g, '');
      const segArr = isStart ? startSegs : endSegs;
      const fullEl = isStart ? startFull : endFull;
      const all = segArr.map(s => s.value).filter(Boolean);
      if (all.length === 3) fullEl.value = all.join('-');
      updatePreview();
    });
  });

  const exStartEl = $('ex-start');
  const exEndEl = $('ex-end');
  exStartEl.addEventListener('input', () => { exStartEl.value = exStartEl.value.toUpperCase(); updatePreview(); });
  exEndEl.addEventListener('input', () => { exEndEl.value = exEndEl.value.toUpperCase(); updatePreview(); });

  function updatePreview() {
    const card = $('range-preview');
    const submitBtn = $('range-submit');
    const sParts = startSegs.map(s => s.value.trim());
    const eParts = endSegs.map(s => s.value.trim());

    if (sParts.some(p => !p) || eParts.some(p => !p)) {
      card.className = 'preview-card empty';
      card.innerHTML = '<div class="preview-count">미리보기</div><div class="preview-list">시작/끝을 모두 입력해주세요</div>';
      submitBtn.disabled = true;
      submitBtn.textContent = '전송';
      return;
    }

    const exStart = parseLocation(exStartEl.value);
    const exEnd = parseLocation(exEndEl.value);
    const result = expandRange(sParts, eParts, exStart, exEnd);
    if (!result.ok) {
      card.className = 'preview-card error';
      card.innerHTML = `<div class="preview-count">⚠ ${result.reason}</div>`;
      submitBtn.disabled = true;
      submitBtn.textContent = '전송';
      return;
    }

    card.className = 'preview-card';
    const locs = result.locations;
    const exCount = result.excluded || 0;
    const display = locs.length <= 6
      ? locs.join(', ')
      : `${locs.slice(0, 3).join(', ')}, ... , ${locs[locs.length - 1]}`;
    const exText = exCount > 0 ? ` <span style="color:var(--error);font-family:inherit">(${exCount}개 제외됨)</span>` : '';
    card.innerHTML = `<div class="preview-count">${locs.length}개 로케이션${exText}</div><div class="preview-list">${display}</div>`;
    submitBtn.disabled = false;
    submitBtn.textContent = `${locs.length}개 전송`;
    submitBtn.dataset.locations = JSON.stringify(locs);
  }

  $('range-submit').addEventListener('click', async () => {
    const locs = JSON.parse($('range-submit').dataset.locations || '[]');
    if (locs.length === 0) return;
    const ok = await sendReport(locs, $('range-notes').value.trim(), $('range-submit'), `${locs.length}개 전송`);
    if (ok) {
      startFull.value = '';
      endFull.value = '';
      exStartEl.value = '';
      exEndEl.value = '';
      [...startSegs, ...endSegs].forEach(s => s.value = '');
      $('range-notes').value = '';
      updatePreview();
    }
  });
}

// ---- 전송 (GET 방식) ----
async function sendReport(locations, notes, btn, originalLabel) {
  if (!config.endpoint) {
    showToast('설정에서 엔드포인트를 등록해주세요', 'error');
    return false;
  }

  btn.disabled = true;
  btn.textContent = '전송 중...';

  try {
    const payload = { locations, notes, timestamp: new Date().toISOString() };
    const params = new URLSearchParams({ data: JSON.stringify(payload) });
    const url = config.endpoint + '?' + params.toString();

    // Image 방식 - CORS/쿠키 문제 완전 우회
    await new Promise((resolve) => {
      const img = new Image();
      img.onload = resolve;
      img.onerror = resolve; // 응답이 JSON이라 onerror 뜨지만 서버는 처리됨
      img.src = url;
      setTimeout(resolve, 3000); // 3초 안전장치
    });

    const summary = locations.length === 1
      ? locations[0]
      : `${locations[0]} 외 ${locations.length - 1}개`;
    recent.unshift({ summary, time: timeNow() });
    recent = recent.slice(0, 10);
    localStorage.setItem(RECENT_KEY, JSON.stringify(recent));

    showToast(`전송 완료: ${summary}`, 'success');
    renderRecent();
    return true;
  } catch (err) {
    showToast('전송 실패: ' + err.message, 'error');
    return false;
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

function showToast(msg, type='') {
  const toast = $('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2500);
}

function renderRecent() {
  const list = $('recentList');
  if (recent.length === 0) {
    list.innerHTML = '<div class="recent-empty">아직 전송 내역이 없어요</div>';
    return;
  }
  list.innerHTML = recent.slice(0, 5).map(r => `
    <div class="recent-item">
      <span class="recent-loc">${r.summary}</span>
      <span class="recent-time">${r.time}</span>
    </div>
  `).join('');
}

function updateStatus() {
  const pill = $('statusPill');
  const text = $('statusText');
  if (config.endpoint) {
    pill.classList.add('connected');
    text.textContent = '연결됨';
  } else {
    pill.classList.remove('connected');
    text.textContent = '설정 필요 — 우측 상단 톱니바퀴';
  }
}

function setupTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const mode = tab.dataset.mode;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.panel').forEach(p => {
        p.classList.toggle('active', p.id === `panel-${mode}`);
      });
    });
  });
}

function setupSettings() {
  $('settingsBtn').addEventListener('click', () => {
    $('endpointInput').value = config.endpoint || '';
    $('modalBg').classList.add('show');
  });
  $('modalCancel').addEventListener('click', () => $('modalBg').classList.remove('show'));
  $('modalSave').addEventListener('click', () => {
    config.endpoint = $('endpointInput').value.trim();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
    updateStatus();
    $('modalBg').classList.remove('show');
    showToast('저장됨', 'success');
  });
  $('modalBg').addEventListener('click', e => {
    if (e.target === $('modalBg')) $('modalBg').classList.remove('show');
  });
}

updateStatus();
renderRecent();
setupTabs();
setupSingle();
setupRange();
setupSettings();
</script>
</body>
</html>
